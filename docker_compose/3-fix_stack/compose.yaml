services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: compose_password
    # (le mot de passe de la base a disparu quelque part...)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine

  web:
    image: nginx:alpine
    ports:
      - "8080:80"

  api:
    image: nginx:alpine
    ports:
      - "8000:80"
    depends_on:
      - db